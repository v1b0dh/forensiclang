[package]
name = "carve-runtime"
version.workspace = true
edition.workspace = true
description = "CARVE forensic runtime — sanitization, carving, memory, disk, network, and timeline modules"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"
